<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 70 160 180" width="32" height="32">
  <defs>
    <linearGradient id="faviconHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="faviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <path
    d="M250 80 L320 120 L320 200 L250 240 L180 200 L180 120 Z"
    fill="none"
    stroke="url(#faviconHexGrad)"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#faviconGlow)"
  />

  <!-- Inner hexagon -->
  <path
    d="M250 110 L290 130 L290 180 L250 200 L210 180 L210 130 Z"
    fill="#0f172a"
    fill-opacity="0.6"
    stroke="#475569"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Climbing maze path -->
  <path
    d="M250 200 L250 170 L220 170 L220 140 L280 140 L280 110 L250 110 L250 80"
    fill="none"
    stroke="#06b6d4"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#faviconGlow)"
  />

  <!-- Node points -->
  <circle cx="250" cy="200" r="7" fill="#06b6d4" filter="url(#faviconGlow)" />
  <circle cx="220" cy="170" r="6" fill="#0ea5e9" />
  <circle cx="280" cy="140" r="6" fill="#6366f1" />
  <circle cx="250" cy="80" r="9" fill="#8b5cf6" filter="url(#faviconGlow)" />
</svg>